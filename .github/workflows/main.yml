name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  supported:
    name: Ruby ${{ matrix.ruby }} / Active Record ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "3.2"
            rails: "7.1"
            appraisal: rails_7_1
          - ruby: "3.3"
            rails: "7.1"
            appraisal: rails_7_1
          - ruby: "3.2"
            rails: "7.2"
            appraisal: rails_7_2
          - ruby: "3.3"
            rails: "7.2"
            appraisal: rails_7_2
          - ruby: "3.4"
            rails: "7.2"
            appraisal: rails_7_2
          - ruby: "3.2"
            rails: "8.0"
            appraisal: rails_8_0
          - ruby: "3.3"
            rails: "8.0"
            appraisal: rails_8_0
          - ruby: "3.4"
            rails: "8.0"
            appraisal: rails_8_0
          - ruby: "4.0"
            rails: "8.0"
            appraisal: rails_8_0
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.appraisal }}.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec

  package:
    name: Package and benchmark
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_8_0.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem build rollgeist.gemspec
      - run: bundle exec ruby -Ilib benchmark/serialization.rb

  rails-main:
    name: Rails main compatibility
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/rails_main.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rspec
